<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KAO 관피타 파트 연습참여</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f5f5;min-height:100vh;color:#1a1a1a}
.app{max-width:960px;margin:0 auto;padding:1.5rem 1rem}
h1{font-size:30px;font-weight:500;margin-bottom:1.25rem}
.main-layout{display:grid;grid-template-columns:1fr 1fr;gap:1.25rem}
@media(max-width:600px){.main-layout{grid-template-columns:1fr}}
.card{background:#fff;border:0.5px solid #e0e0e0;border-radius:12px;padding:1rem 0.5rem}
.sec-title{font-size:18px;font-weight:500;color:#888;text-transform:uppercase;letter-spacing:.05em;margin-bottom:10px}
.legend{display:flex;gap:12px;margin-bottom:10px;font-size:14px;color:#888;flex-wrap:wrap}
.legend-item{display:flex;align-items:center;gap:4px}
.legend-dot{width:9px;height:9px;border-radius:50%}
.dot-red{background:#E24B4A}
.dot-yellow{background:#378ADD}
.cal-header{display:grid;grid-template-columns:auto 1fr auto;align-items:center;margin-bottom:8px}
.cal-month{text-align:center}
.cal-nav{background:none;border:none;color:#888;font-size:29px;cursor:pointer;padding:2px 6px;border-radius:4px}
.cal-nav:hover{background:#f0f0f0}
.cal-month{font-size:22px;font-weight:500}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal-dow{font-size:16px;color:#aaa;text-align:center;padding:3px 0}
.cal-cell{text-align:center;padding:2px 1px;border-radius:4px;min-height:58px;display:flex;flex-direction:column;align-items:center;cursor:pointer}
.cal-cell:not(.other):hover .cal-num{background:#f0f0f0}
.cal-cell.other{opacity:.3;pointer-events:none}
.cal-num{font-size:18px;width:20px;height:20px;line-height:20px;border-radius:50%;color:#666}
.cal-cell.wed .cal-num{color:#1D9E75;font-weight:500}
.cal-cell.today .cal-num{background:#dbeafe;color:#1d4ed8}
.cal-cell.holiday .cal-num{color:#E24B4A}
.dots{display:flex;gap:2px;justify-content:center;margin-top:1px}
.dot-r{width:9px;height:9px;border-radius:50%;background:#E24B4A}
.dot-y{width:9px;height:9px;border-radius:50%;background:#378ADD}
.cal-ev-title{font-size:11px;color:#185FA5;max-width:100%;white-space:normal;word-break:break-all;line-height:1.15;margin-top:1px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cal-week-empty{grid-column:1/8;text-align:center;font-size:11px;color:#E24B4A;padding:1px 0 5px}
.ev-box{margin-top:10px;background:#f8f8f8;border:0.5px solid #e0e0e0;border-radius:8px;padding:10px 12px;display:none}
.ev-box.show{display:block}
.ev-box-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.ev-box-date{font-size:18px;color:#aaa}
.ev-btns{display:flex;gap:4px}
.ev-edit{font-size:18px;background:none;border:0.5px solid #ddd;border-radius:4px;padding:2px 7px;cursor:pointer;color:#666}
.ev-edit:hover{color:#111}
.ev-del{font-size:19px;background:none;border:none;cursor:pointer;color:#aaa;padding:2px 4px}
.ev-del:hover{color:#E24B4A}
.ev-title{font-size:21px;font-weight:500;margin-bottom:3px}
.ev-content{font-size:19px;color:#666;line-height:1.6;white-space:pre-wrap}
.ev-add-row{display:flex;align-items:center;justify-content:space-between}
.ev-add-label{font-size:19px;color:#aaa}
.ev-add-btn{font-size:18px;background:#1D9E75;color:#fff;border:none;border-radius:6px;padding:3px 10px;cursor:pointer}
/* modal */
.modal-wrap{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;z-index:200}
.modal{background:#fff;border-radius:12px;padding:1.5rem;width:550px;max-width:90%;max-height:80vh;overflow-y:auto;box-shadow:0 8px 32px rgba(0,0,0,.15)}
.modal-hd{font-size:22px;font-weight:500;margin-bottom:12px}
.modal label{font-size:18px;color:#888;display:block;margin-bottom:4px;margin-top:10px}
.modal input,.modal textarea{width:100%;font-size:21px;padding:7px 10px;border:0.5px solid #ddd;border-radius:8px;background:#f8f8f8;font-family:inherit;resize:vertical;outline:none}
.modal textarea{min-height:250px}
.modal input:focus,.modal textarea:focus{border-color:#1D9E75}
.modal-btns{display:flex;gap:8px;margin-top:14px;justify-content:flex-end}
.btn-cancel{background:none;border:0.5px solid #ddd;border-radius:8px;padding:6px 14px;font-size:21px;color:#666;cursor:pointer}
.btn-save{background:#1D9E75;color:#fff;border:none;border-radius:8px;padding:6px 14px;font-size:21px;font-weight:500;cursor:pointer}
.btn-save:hover{background:#0F6E56}
/* tiles */
.tile-list{display:flex;flex-direction:column;gap:6px;margin-bottom:10px;max-height:460px;overflow-y:auto}
.date-tile{background:#f8f8f8;border:0.5px solid #e0e0e0;border-radius:8px;padding:8px 11px;cursor:pointer;transition:border-color .12s}
.date-tile:hover{border-color:#bbb}
.date-tile.sel{border-color:#1D9E75;border-width:1.5px}
.tile-top{display:flex;align-items:center;justify-content:space-between}
.tile-dt{font-size:21px;font-weight:500}
.del-t{background:none;border:none;font-size:16px;color:#aaa;cursor:pointer;padding:2px 4px}
.del-t:hover{color:#E24B4A}
.tile-stats{display:flex;gap:8px;margin-top:3px;font-size:18px}
.so{color:#1D9E75}.sx{color:#E24B4A}.sq{color:#aaa}
.add-row{display:flex;gap:6px}
.add-row input{flex:1;font-size:19px;padding:6px 8px;border:0.5px solid #ddd;border-radius:8px;background:#fff;outline:none}
.add-row input:focus{border-color:#1D9E75}
.btn-p{background:#1D9E75;color:#fff;border:none;border-radius:8px;padding:6px 12px;font-size:19px;font-weight:500;cursor:pointer;white-space:nowrap}
.btn-p:hover{background:#0F6E56}
/* attendance */
.detail-wrap{grid-column:1/-1}
.att-card{background:#fff;border:0.5px solid #e0e0e0;border-radius:12px;padding:1rem 1.25rem}
.att-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.att-title{font-size:26px;font-weight:500}
.close-btn{background:none;border:none;font-size:26px;color:#888;cursor:pointer}
.stats-row{display:flex;gap:8px;margin-bottom:14px}
.sp{flex:1;text-align:center;padding:5px 0;border-radius:8px;font-size:19px;font-weight:500}
.sp-o{background:#E1F5EE;color:#0F6E56}
.sp-x{background:#FCEBEB;color:#A32D2D}
.sp-q{background:#f5f5f5;color:#888}
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:12px}
@media(max-width:480px){.mgrid{grid-template-columns:repeat(2,1fr)}}
.mc{background:#f8f8f8;border:0.5px solid #e0e0e0;border-radius:8px;padding:8px 10px;display:flex;align-items:center;justify-content:space-between;gap:6px}
.mn{font-size:21px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bg{display:flex;gap:4px;flex-shrink:0}
.ab{width:28px;height:28px;border-radius:50%;border:0.5px solid #ddd;background:none;font-size:19px;font-weight:700;color:#aaa;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .1s}
.ab.ao{background:#1D9E75;color:#fff;border-color:#1D9E75}
.ab.ax{background:#E24B4A;color:#fff;border-color:#E24B4A}
.ab:hover{background:#eee}
.btn-add-s{background:#1D9E75;color:#fff;border:none;border-radius:6px;padding:5px 10px;font-size:19px;cursor:pointer}
.mgmt-inp{font-size:19px;padding:6px 9px;border:0.5px solid #ddd;border-radius:6px;background:#f8f8f8;outline:none;font-family:inherit}
.mgmt-inp:focus{border-color:#1D9E75}
.top-btn{font-size:15px;background:none;border:0.5px solid #ddd;border-radius:6px;padding:3px 10px;color:#aaa;cursor:pointer}
.pm-btn{font-size:19px;font-weight:500;line-height:1;border-radius:6px;padding:4px 14px;cursor:pointer}
.mg-sec{font-size:17px;color:#aaa;margin:14px 0 7px}
.mg-sec:first-child{margin-top:4px}
.mg-row{border:0.5px solid #e0e0e0;border-radius:8px;padding:8px 10px;margin-bottom:6px;background:#f8f8f8}
.mg-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.mg-name{font-size:20px;color:#1a1a1a;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mg-x{font-size:15px;line-height:1;background:none;border:0.5px solid #E24B4A;color:#E24B4A;border-radius:5px;width:30px;height:30px;cursor:pointer;padding:0;flex-shrink:0}
.mg-edit{font-size:16px;background:none;border:0.5px solid #ddd;color:#666;border-radius:5px;padding:4px 10px;cursor:pointer;flex-shrink:0}
.mg-cf{margin-top:9px;border-top:0.5px solid #e8e8e8;padding-top:9px}
.mg-cf-msg{font-size:17px;line-height:1.55;margin-bottom:9px}
.mg-cf-btns{display:flex;gap:6px}
.mg-cf-btns button{flex:1;border-radius:7px;padding:8px 0;font-size:18px;cursor:pointer;font-family:inherit}
.chip{font-size:17px;background:#f1efe8;color:#5F5E5A;border-radius:14px;padding:4px 12px}
.att-chk{display:flex;align-items:center;gap:9px;margin-top:14px;padding:10px 12px;background:#E1F5EE;border:0.5px solid #9FE1CB;border-radius:8px;cursor:pointer}
.att-chk input{width:19px;height:19px;flex-shrink:0;accent-color:#1D9E75;margin:0}
.att-chk span{font-size:18px;color:#0F6E56;line-height:1.5}
.restore-btn{font-size:15px;background:none;border:0.5px solid #1D9E75;color:#0F6E56;border-radius:5px;padding:4px 11px;cursor:pointer;flex-shrink:0}
.empty{font-size:21px;color:#aaa;text-align:center;padding:1rem 0}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#333;color:#fff;font-size:21px;padding:8px 18px;border-radius:20px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:300}
.toast.show{opacity:1}
.saving-pill{position:fixed;top:10px;right:10px;background:#555;color:#fff;font-size:15px;padding:5px 12px;border-radius:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:300}
.saving-pill.show{opacity:.9}
.loading{font-size:19px;color:#aaa;text-align:center;padding:.5rem 0}
.footer{text-align:center;font-size:13px;color:#bbb;padding:1.5rem 0 1rem;line-height:1.8}
</style>
</head>
<body>

<div class="app">
  <h1 onclick="location.reload()" style="cursor:pointer" title="클릭하면 새로고침">KAO 관피타 파트 연습참여</h1>
  <div class="main-layout">
    <div class="card" id="cal-card">
      <div class="cal-header">
        <button class="cal-nav" id="prev-m">&#8249;</button>
        <span class="cal-month" id="cal-label"></span>
        <div style="display:flex;align-items:center;gap:6px">
          <div style="display:flex;align-items:center;gap:7px;font-size:13px;color:#aaa">
            <span style="display:flex;align-items:center;gap:3px"><span style="width:8px;height:8px;border-radius:50%;background:#E24B4A;display:inline-block"></span>연습</span>
            <span style="display:flex;align-items:center;gap:3px"><span style="width:8px;height:8px;border-radius:50%;background:#378ADD;display:inline-block"></span>행사</span>
          </div>
          <button class="cal-nav" id="next-m">&#8250;</button>
        </div>
      </div>
      <div class="cal-grid" id="cal-grid"></div>
      <div class="ev-box" id="ev-has">
        <div class="ev-box-top">
          <span class="ev-box-date" id="ev-has-date"></span>
          <div class="ev-btns">
            <button class="ev-edit" id="ev-edit-btn">수정</button>
            <button class="ev-del" id="ev-del-btn">✕</button>
          </div>
        </div>
        <div class="ev-title" id="ev-has-title"></div>
        <div class="ev-content" id="ev-has-content"></div>
      </div>
      <div class="ev-box" id="ev-none">
        <div class="ev-add-row">
          <span class="ev-add-label" id="ev-none-date"></span>
          <button class="ev-add-btn" id="ev-none-add">+ 일정 추가</button>
        </div>
      </div>
    </div>

    <div class="card">
      <div style="display:flex;gap:6px;margin-bottom:8px;align-items:center">
        <button class="top-btn" id="past-toggle-btn" onclick="togglePast()">지난 날짜 보기</button>
        <button class="btn-p pm-btn" id="mg-add-btn" title="멤버 추가">+</button>
        <button class="top-btn pm-btn" id="mg-edit-btn" title="수정 · 삭제">−</button>
        <button class="top-btn" id="trash-btn" style="margin-left:auto">휴지통</button>
      </div>
      <div class="tile-list" id="tile-list"><div class="loading">불러오는 중...</div></div>
    </div>

    <div class="detail-wrap" id="detail-wrap" style="display:none">
      <div class="att-card">
        <div class="att-hd">
          <span class="att-title" id="att-title"></span>
          <button class="close-btn" id="close-att">✕</button>
        </div>
        <div class="stats-row">
          <div class="sp sp-o" id="sp-o">참여 0명</div>
          <div class="sp sp-x" id="sp-x">불참 0명</div>
          <div class="sp sp-q" id="sp-q">미투표 0명</div>
        </div>
        <div class="mgrid" id="mgrid"></div>
      </div>
    </div>
  </div>
</div>

<!-- 날짜 수정 모달 -->
<div class="modal-wrap" id="edit-date-wrap" style="display:none">
  <div class="modal">
    <div class="modal-hd">날짜 수정</div>
    <label>날짜</label><input type="date" id="ed-date">
    <label>표시 텍스트 (선택)</label><input type="text" id="ed-label" placeholder="예: 특별 연습, 공연 준비 등">
    <div class="modal-btns">
      <button class="btn-cancel" id="ed-cancel">취소</button>
      <button class="btn-save" id="ed-save">저장</button>
    </div>
  </div>
</div>

<!-- modal -->
<div class="modal-wrap" id="modal-wrap" style="display:none">
  <div class="modal">
    <div class="modal-hd" id="modal-hd">일정 추가</div>
    <label>날짜</label><input type="date" id="m-date">
    <label>제목</label><input type="text" id="m-title" placeholder="일정 제목">
    <label>내용</label><textarea id="m-content" placeholder="상세 내용을 입력하세요"></textarea>
    <label class="att-chk" id="m-att-row"><input type="checkbox" id="m-att"><span>이 날 출석도 체크받기</span></label>
    <div class="modal-btns">
      <button class="btn-cancel" id="m-cancel">취소</button>
      <button class="btn-save" id="m-save">저장</button>
    </div>
  </div>
</div>

<!-- 날짜·멤버 관리 모달 (+ / −) -->
<div class="modal-wrap" id="mg-wrap" style="display:none">
  <div class="modal">
    <div class="modal-hd" id="mg-hd">멤버 추가</div>
    <div id="mg-body"></div>
    <div class="modal-btns">
      <button class="btn-cancel" id="mg-close">닫기</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<div class="saving-pill" id="saving-pill">저장 중…</div>

<div class="footer">
  © 2026 관피타출첵 · 개발 최송희. 무단 복제 및 배포를 금지합니다.<br>
  <span id="ver-badge">v2.7</span>
</div>

<script>
const APP_VERSION = 'v2.7';
// ★★★ 여기에 Apps Script 웹 앱 URL을 붙여넣으세요 ★★★
const GAS_URL = 'https://script.google.com/macros/s/AKfycby3gRr84-pjpZhSTvFF4D-Uh8PC6_lgu8tmy9QUi8-62UJ1L_l26tnxJiZwzX3EBZDh/exec';

const HOL = new Set(['2026-01-01','2026-02-16','2026-02-17','2026-02-18','2026-03-01','2026-05-05','2026-05-15','2026-06-06','2026-08-15','2026-09-24','2026-09-25','2026-09-26','2026-10-03','2026-10-09','2026-12-25']);
let S = {members:['김차현','김효경','소형준','오유선','이광빈','이연희','장아름','최송희'],dates:[],attendance:{},events:[],labels:{},selDate:null,selCal:null};
let calY = new Date().getFullYear(), calM = new Date().getMonth(), editIdx = null, showPast = false, showTrash = false;

const $ = id => document.getElementById(id);

function toStr(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function fmt(s){ const p=s.split('-'),d=new Date(+p[0],+p[1]-1,+p[2]),n=['일','월','화','수','목','금','토']; return `${d.getMonth()+1}월 ${d.getDate()}일 (${n[d.getDay()]})`; }
function fmtFull(s){ const base=fmt(s); const lbl=(S.labels&&S.labels[s])?` · ${S.labels[s]}`:''; return base+lbl; }
function toast(msg){ const t=$('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2000); }

function fetchWithTimeout(url, opts={}, ms=4000){
  const ctrl=new AbortController();
  const id=setTimeout(()=>ctrl.abort(),ms);
  return fetch(url,{...opts,signal:ctrl.signal}).finally(()=>clearTimeout(id));
}
// 저장소가 막힌 브라우저(시크릿 모드, 사이트 데이터 차단)에서도 앱이 죽지 않도록 감싼다.
function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }

async function gasGet(key){
  const r = await fetchWithTimeout(`${GAS_URL}?action=get&key=${encodeURIComponent(key)}`, {}, 8000);
  const j = await r.json();
  if(j.ok && j.value){
    lsSet('kao_bak_'+key, j.value);
    return j.value;
  }
  return null;
}
// mode:'no-cors' 응답은 읽을 수 없으므로(항상 성공한 것처럼 보임) cors로 바꿔 서버의 실제 성공/실패(ok)를 확인한다.
// Content-Type은 text/plain으로 보낸다 — application/json으로 보내면 브라우저가 CORS preflight(OPTIONS)를
// 먼저 보내는데 Apps Script 웹앱은 OPTIONS를 처리하지 못해 요청 자체가 막힌다. GAS는 body 내용만 보고
// JSON.parse하므로 헤더가 text/plain이어도 동작은 동일하다.
async function gasSet(key, value){
  const r = await fetchWithTimeout(GAS_URL, {
    method: 'POST',
    headers: {'Content-Type': 'text/plain;charset=utf-8'},
    body: JSON.stringify({app: 'kao', action: 'set', key, value})
  }, 8000);
  const j = await r.json();
  if(!j.ok) throw new Error(j.message||'서버 저장 거부됨');
  lsSet('kao_bak_'+key, value);
}

function applyState(d){
  S.members=d.members||S.members; S.attendance=d.attendance||{}; S.events=d.events||[];
  S.dates=d.dates||[]; S.deleted=d.deleted||[]; S.labels=d.labels||{};
}

// 서버 로드 실패 시 로컬 백업으로라도 화면은 보여주되, saveGuardOk=false로 두어 저장은 막는다.
// (다른 기기의 로드 실패가 전체 기록을 빈 값으로 덮어쓰던 근본 원인 차단)
let saveGuardOk = false;
async function load(){
  // GAS 왕복은 2~20초까지 걸린다. 그동안 빈 화면을 보여주지 않도록 직전 백업으로 먼저 그린다.
  // 저장 잠금(saveGuardOk)은 그대로라, 서버 응답 전에는 화면만 보이고 저장은 여전히 막힌다.
  const bak = lsGet('kao_bak_kao-state');
  if(bak){ try{ applyState(JSON.parse(bak)); autoWed(); render(); }catch(e){} }
  $('ver-badge').textContent = APP_VERSION;
  try{
    const v = await gasGet('kao-state');
    if(v){ applyState(JSON.parse(v)); saveGuardOk = true; }
  }catch(e){
    toast('서버 연결 실패 · 새로고침 전까지 저장이 제한됩니다');
  }
  autoWed(); render();
}

// 화면은 누르는 즉시 바꾸고(낙관적 UI), 서버 저장은 뒤에서 모아서 한 번에 처리한다.
// 저장 직전 서버 최신값을 다시 읽어와 그 위에 대기중인 변경들을 다시 얹으므로,
// 동시에 다른 사람이 저장한 내용을 덮어쓰지 않는 성질은 그대로 유지된다.
let saving = false;
let pending = [];          // 아직 서버에 반영되지 않은 변경들
let flushTimer = null;
const FLUSH_DELAY = 900;   // 연타를 모으는 시간(ms)

function setPendingUI(){ $('saving-pill').classList.toggle('show', pending.length>0 || saving); }

function mutateAndSave(mutator){
  mutator();
  pending.push(mutator);
  render();
  setPendingUI();
  clearTimeout(flushTimer);
  flushTimer = setTimeout(flush, FLUSH_DELAY);
}

async function flush(){
  if(saving || !pending.length) return;
  const batch = pending; pending = [];
  saving = true; setPendingUI();
  try{
    const v = await gasGet('kao-state');
    if(v) applyState(JSON.parse(v));
    saveGuardOk = true;
    batch.forEach(fn=>fn());   // 서버 최신값 위에 내 변경들을 다시 얹는다
    render();
    await sv();
  }catch(e){
    pending = batch.concat(pending);   // 실패분은 되돌려 다음 시도에 재전송
    toast('저장 실패 · 네트워크 확인 후 다시 시도해주세요');
  }finally{
    saving = false;
    setPendingUI();
    if(pending.length){ clearTimeout(flushTimer); flushTimer = setTimeout(flush, FLUSH_DELAY); }
  }
}

// 저장이 밀린 상태로 창을 닫으면 그 변경은 사라진다. 닫기 전에 경고하고, 탭을 벗어날 땐 즉시 저장 시도.
window.addEventListener('beforeunload', e=>{ if(pending.length || saving){ e.preventDefault(); e.returnValue=''; } });
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='hidden' && pending.length){ clearTimeout(flushTimer); flush(); } });

async function sv(){
  if(!saveGuardOk){ toast('서버와 동기화 전이라 저장할 수 없어요 · 새로고침 해주세요'); throw new Error('save blocked: not synced'); }
  await gasSet('kao-state', JSON.stringify({members:S.members,attendance:S.attendance,events:S.events,dates:S.dates,deleted:S.deleted,labels:S.labels}));
  toast('저장됨');
}

function autoWed(){
  const today=new Date(); today.setHours(0,0,0,0);
  const start=new Date(today);
  const diff=((3-today.getDay()+7)%7)||7;
  start.setDate(start.getDate()+diff);
  const ex=new Set(S.dates);
  const del=new Set(S.deleted||[]);
  for(let i=0;i<8;i++){ const d=new Date(start); d.setDate(d.getDate()+i*7); const s=toStr(d); if(!HOL.has(s)&&!ex.has(s)&&!del.has(s)){S.dates.push(s);ex.add(s);} }
  S.dates=[...new Set(S.dates)].sort();
}
function stats(dt){ const a=S.attendance[dt]||{}; let o=0,x=0; S.members.forEach(m=>{if(a[m]==='o')o++;else if(a[m]==='x')x++;}); return{o,x,q:S.members.length-o-x}; }
function render(){ rCal(); rTiles(); rDetail(); if($('mg-wrap').style.display==='flex') rMg(); }

function rCal(){
  $('cal-label').textContent=`${calY}년 ${calM+1}월`;
  const dn=['일','월','화','수','목','금','토'];
  let h=dn.map(d=>`<div class="cal-dow">${d}</div>`).join('');
  const first=new Date(calY,calM,1),last=new Date(calY,calM+1,0),tod=toStr(new Date());
  const em={}; S.events.forEach((ev,i)=>{em[ev.date]={...ev,i};});
  const prac=new Set(S.dates);
  const cells=[];
  for(let i=0;i<first.getDay();i++){ const d=new Date(calY,calM,1-first.getDay()+i); cells.push({other:true,num:d.getDate()}); }
  for(let d=1;d<=last.getDate();d++){ cells.push({num:d,dt:new Date(calY,calM,d),s:toStr(new Date(calY,calM,d))}); }
  const rem=(7-cells.length%7)%7;
  for(let i=1;i<=rem;i++)cells.push({other:true,num:i});
  for(let w=0;w<cells.length;w+=7){
    const week=cells.slice(w,w+7);
    let weekHasPrac=false;
    week.forEach(c=>{
      if(c.other){ h+=`<div class="cal-cell other"><div class="cal-num">${c.num}</div></div>`; return; }
      const {s,dt}=c;
      const wed=dt.getDay()===3,hol=HOL.has(s),isT=s===tod,hasEv=!!em[s];
      if(prac.has(s)&&!hol)weekHasPrac=true;
      let cls='cal-cell'; if(wed)cls+=' wed'; if(hol)cls+=' holiday'; if(isT)cls+=' today';
      let dots=''; if(prac.has(s)&&!hol)dots+=`<div class="dot-r"></div>`; if(hasEv)dots+=`<div class="dot-y"></div>`;
      const et=hasEv?`<div class="cal-ev-title">${em[s].title}</div>`:'';
      h+=`<div class="${cls}" onclick="cClick('${s}')"><div class="cal-num">${c.num}</div>${dots?`<div class="dots">${dots}</div>`:''}${et}</div>`;
    });
    if(!weekHasPrac)h+=`<div class="cal-week-empty">연습없음</div>`;
  }
  $('cal-grid').innerHTML=h; rEvBox();
}

function cClick(s){ S.selCal=s; rEvBox(); }
function rEvBox(){
  const em={}; S.events.forEach((ev,i)=>{em[ev.date]={...ev,i};});
  const hb=$('ev-has'),nb=$('ev-none');
  if(!S.selCal){ hb.classList.remove('show'); nb.classList.remove('show'); return; }
  if(em[S.selCal]){
    const ev=em[S.selCal];
    $('ev-has-date').textContent=fmt(S.selCal);
    $('ev-has-title').textContent=ev.title;
    $('ev-has-content').textContent=ev.content||'';
    hb.classList.add('show'); nb.classList.remove('show');
    $('ev-edit-btn').onclick=()=>openModal(S.selCal,ev.i);
    $('ev-del-btn').onclick=()=>{ const idx=ev.i; mutateAndSave(()=>{ S.events.splice(idx,1); S.selCal=null; }); };
  } else {
    $('ev-none-date').textContent=fmt(S.selCal);
    nb.classList.add('show'); hb.classList.remove('show');
    $('ev-none-add').onclick=()=>openModal(S.selCal,null);
  }
}

function openModal(date,idx){
  editIdx=idx;
  $('modal-hd').textContent=idx!=null?'일정 수정':'일정 추가';
  $('m-date').value=date||'';
  $('m-title').value=idx!=null?S.events[idx].title:'';
  $('m-content').value=idx!=null?(S.events[idx].content||''):'';
  // 새 일정은 기본으로 출첵을 받는다. 이미 출첵 날짜가 있는 일정은 그 상태를 그대로 보여준다.
  $('m-att').checked = date ? (idx!=null ? S.dates.includes(date) : true) : true;
  $('modal-wrap').style.display='flex';
}
$('m-cancel').onclick=()=>$('modal-wrap').style.display='none';
$('m-content').addEventListener('keydown',e=>{if(e.key==='Enter'&&(e.ctrlKey||e.metaKey))$('m-save').click();});
$('modal-wrap').onclick=e=>{ if(e.target===$('modal-wrap'))$('modal-wrap').style.display='none'; };
$('m-save').onclick=()=>{
  const date=$('m-date').value,title=$('m-title').value.trim(),content=$('m-content').value.trim();
  if(!date||!title)return;
  const idx=editIdx;
  const wantAtt=$('m-att').checked;
  $('modal-wrap').style.display='none';
  mutateAndSave(()=>{
    if(idx!=null){S.events[idx]={date,title,content};}else{S.events.push({date,title,content});}
    // 출첵을 받기로 했으면 그 날짜를 목록에 만든다. 예전에 지웠던 날짜라면 휴지통에서도 꺼낸다.
    if(wantAtt){
      S.deleted=(S.deleted||[]).filter(x=>x!==date);
      if(!S.dates.includes(date)){ S.dates.push(date); S.dates=[...new Set(S.dates)].sort(); }
      if(!S.labels)S.labels={};
      if(!S.labels[date])S.labels[date]=title;
    }
    S.selCal=date;
  });
};

function togglePast(){
  showPast=!showPast;
  const btn=$('past-toggle-btn');
  btn.textContent=showPast?'지난 날짜 숨기기':'지난 날짜 보기';
  btn.style.color=showPast?'#1D9E75':'#aaa';
  btn.style.borderColor=showPast?'#1D9E75':'#ddd';
  rTiles();
}

// 타일에는 수정·삭제 버튼을 두지 않는다. 누르면 출첵 화면만 열린다.
// (날짜 관리는 상단 − 버튼의 관리 창에서만 — 목록에서 실수로 지우는 경로를 없앴다)
function rTiles(){
  const l=$('tile-list');
  if(showTrash){ rTrash(); return; }
  const tod=toStr(new Date());
  const visible=showPast?S.dates:S.dates.filter(d=>d>=tod);
  if(!visible.length){l.innerHTML=`<div class="empty">${S.dates.length?'지난 날짜만 있어요 · 위 버튼으로 보기':'날짜가 없습니다'}</div>`;return;}
  l.innerHTML=visible.map(d=>{
    const st=stats(d),sel=S.selDate===d?' sel':'';
    return `<div class="date-tile${sel}" onclick="openAtt('${d}')"><div class="tile-top"><span class="tile-dt">${fmtFull(d)}</span></div><div class="tile-stats"><span class="so">참여 ${st.o}명</span><span class="sx">불참 ${st.x}명</span><span class="sq">미투표 ${st.q}명</span></div></div>`;
  }).join('');
}

// 삭제된 날짜는 S.deleted에만 담기고 출석 기록(S.attendance)은 지워지지 않는다.
// 그래서 복원하면 그 날 누가 참여했는지까지 그대로 되살아난다.
function rTrash(){
  const l=$('tile-list');
  const del=[...(S.deleted||[])].sort();
  if(!del.length){l.innerHTML='<div class="empty">휴지통이 비어 있습니다</div>';return;}
  l.innerHTML=del.map(d=>{
    const st=stats(d);
    return `<div class="date-tile" style="opacity:.65"><div class="tile-top"><span class="tile-dt">${fmtFull(d)}</span><button class="restore-btn" onclick="restoreDate('${d}')">복원</button></div><div class="tile-stats"><span class="so">참여 ${st.o}명</span><span class="sx">불참 ${st.x}명</span><span class="sq">미투표 ${st.q}명</span></div></div>`;
  }).join('');
}

function restoreDate(d){
  mutateAndSave(()=>{
    S.deleted=(S.deleted||[]).filter(x=>x!==d);
    if(!S.dates.includes(d)){ S.dates.push(d); S.dates=[...new Set(S.dates)].sort(); }
  });
  toast(`${fmt(d)} 복원됨`);
}

function rDetail(){
  const w=$('detail-wrap');
  if(!S.selDate){w.style.display='none';return;}
  w.style.display='block';
  $('att-title').textContent=fmt(S.selDate);
  const st=stats(S.selDate);
  $('sp-o').textContent=`참여 ${st.o}명`; $('sp-x').textContent=`불참 ${st.x}명`; $('sp-q').textContent=`미투표 ${st.q}명`;
  const att=S.attendance[S.selDate]||{};
  if(!S.members.length){$('mgrid').innerHTML='<div class="empty">멤버가 없습니다 · 위 + 버튼으로 추가</div>';return;}
  $('mgrid').innerHTML=S.members.map(m=>{
    const v=att[m]||'';
    return `<div class="mc"><span class="mn">${m}</span><div class="bg"><button class="ab${v==='o'?' ao':''}" onclick="setA('${m}','o')">O</button><button class="ab${v==='x'?' ax':''}" onclick="setA('${m}','x')">X</button></div></div>`;
  }).join('');
}

function openAtt(d){ S.selDate=d; render(); $('detail-wrap').scrollIntoView({behavior:'smooth',block:'nearest'}); }
function setA(m,v){
  const dt=S.selDate;
  // 목표값을 누른 시점에 확정한다. (서버 최신값 위에 다시 얹을 때 토글이 뒤집혀 눌렀던 것과
  //  다른 결과가 나오는 것을 막는다 — 누른 사람의 의도가 그대로 남는다)
  const next = (S.attendance[dt]||{})[m]===v ? '' : v;
  mutateAndSave(()=>{
    if(!S.attendance[dt])S.attendance[dt]={};
    S.attendance[dt][m]=next;
    S.selDate=dt;
  });
}
// 확인 절차는 관리 창 안에서 끝나므로 여기서 다시 묻지 않는다.
function delD(s){
  mutateAndSave(()=>{
    S.dates=S.dates.filter(d=>d!==s);
    if(!S.deleted)S.deleted=[];
    if(!S.deleted.includes(s))S.deleted.push(s);
    if(S.selDate===s)S.selDate=null;
  });
}
function delM(m){ mutateAndSave(()=>{ S.members=S.members.filter(x=>x!==m); }); }

$('close-att').onclick=()=>{ S.selDate=null; render(); };
$('prev-m').onclick=()=>{ calM--; if(calM<0){calM=11;calY--;} rCal(); };
$('next-m').onclick=()=>{ calM++; if(calM>11){calM=0;calY++;} rCal(); };

function toggleTrash(){
  showTrash=!showTrash;
  const b=$('trash-btn');
  b.style.color=showTrash?'#333':'#aaa';
  b.style.borderColor=showTrash?'#888':'#ddd';
  b.textContent=showTrash?'목록으로':'휴지통';
  rTiles();
}
$('trash-btn').onclick=toggleTrash;

// ===== 날짜·멤버 관리 창 =====
// + : 멤버 추가 / − : 수정·삭제. 날짜 추가는 달력의 일정 저장이 대신한다.
let mgMode='add';        // 'add' | 'manage'
let mgConfirm=null;      // 삭제 확인이 펼쳐진 행의 키
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');

function openMg(mode){
  mgMode=mode; mgConfirm=null;
  $('mg-hd').textContent = mode==='add' ? '멤버 추가' : '수정 · 삭제';
  $('mg-wrap').style.display='flex';
  rMg();
}
function closeMg(){ $('mg-wrap').style.display='none'; mgConfirm=null; }
$('mg-add-btn').onclick=()=>openMg('add');
$('mg-edit-btn').onclick=()=>openMg('manage');
$('mg-close').onclick=closeMg;
$('mg-wrap').onclick=e=>{ if(e.target===$('mg-wrap'))closeMg(); };

function rMg(){
  const b=$('mg-body');
  if(mgMode==='add'){
    b.innerHTML=`<div style="display:flex;gap:6px;margin-bottom:12px">
      <input class="mgmt-inp" type="text" id="mg-m-in" placeholder="이름 입력" style="flex:1;min-width:0">
      <button class="btn-add-s" id="mg-m-btn">추가</button>
    </div>
    <div class="mg-sec" style="margin-top:0">현재 멤버 ${S.members.length}명</div>
    <div style="display:flex;flex-wrap:wrap;gap:5px">${S.members.map(m=>`<span class="chip">${esc(m)}</span>`).join('')}</div>
    <div style="font-size:15px;color:#bbb;line-height:1.6;margin-top:14px;border-top:0.5px solid #eee;padding-top:10px">날짜는 수요일이 자동으로 생기고, 그 외 날짜는 달력에서 일정을 넣을 때 함께 생깁니다.</div>`;
    $('mg-m-btn').onclick=addMember;
    $('mg-m-in').addEventListener('keydown',e=>{ if(e.key==='Enter')addMember(); });
    $('mg-m-in').focus();
    return;
  }
  const tod=toStr(new Date());
  const ds=[...S.dates].sort();
  b.innerHTML =
    `<div class="mg-sec">날짜 ${ds.length}개</div>` +
    (ds.length?ds.map(d=>mgRow(fmtFull(d),'date',d,d<tod)).join(''):'<div class="empty" style="font-size:17px">날짜가 없습니다</div>') +
    `<div class="mg-sec">멤버 ${S.members.length}명</div>` +
    (S.members.length?S.members.map(m=>mgRow(m,'member',m,false)).join(''):'<div class="empty" style="font-size:17px">멤버가 없습니다</div>');
}

function mgRow(label,kind,id,dim){
  const key=kind+':'+id;
  const open=mgConfirm===key;
  const editBtn = kind==='date' ? `<button class="mg-edit" onclick="editDate('${esc(id)}')">수정</button>` : '';
  const msg = kind==='date'
    ? '<div class="mg-cf-msg" style="color:#666">삭제해도 출석 기록은 휴지통에 보관됩니다.</div>'
    : '<div class="mg-cf-msg" style="color:#A32D2D">이 사람의 출석 기록도 화면에서 함께 사라집니다.</div>';
  const cf = open ? `<div class="mg-cf">${msg}<div class="mg-cf-btns">
      <button style="background:none;border:0.5px solid #ddd;color:#666" onclick="mgCancel()">취소</button>
      <button style="background:#E24B4A;border:none;color:#fff;font-weight:500" onclick="mgDelete('${kind}','${esc(id)}')">삭제</button>
    </div></div>` : '';
  return `<div class="mg-row"${dim?' style="opacity:.6"':''}>
    <div class="mg-top"><span class="mg-name">${esc(label)}</span>
      <div style="display:flex;gap:5px;flex-shrink:0">${editBtn}<button class="mg-x" onclick="mgAsk('${key.replace(/'/g,"\\'")}')">✕</button></div>
    </div>${cf}</div>`;
}

function mgAsk(key){ mgConfirm = (mgConfirm===key?null:key); rMg(); }
function mgCancel(){ mgConfirm=null; rMg(); }
function mgDelete(kind,id){
  mgConfirm=null;
  if(kind==='date') delD(id); else delM(id);
  rMg();
}

function addMember(){
  const el=$('mg-m-in'); const v=el.value.trim(); if(!v)return;
  if(S.members.includes(v)){ toast('이미 있는 멤버입니다'); return; }
  el.value='';
  mutateAndSave(()=>{ S.members.push(v); });
  rMg();
}

let editDateTarget=null;
function editDate(old){
  editDateTarget=old;
  $('ed-date').value=old;
  $('ed-label').value=(S.labels&&S.labels[old])||'';
  $('edit-date-wrap').style.display='flex';
}
$('ed-cancel').onclick=()=>{ $('edit-date-wrap').style.display='none'; };
$('edit-date-wrap').onclick=e=>{ if(e.target===$('edit-date-wrap'))$('edit-date-wrap').style.display='none'; };
$('ed-save').onclick=()=>{
  const old=editDateTarget;
  const neu=$('ed-date').value;
  const lbl=$('ed-label').value.trim();
  if(!neu)return;
  if(neu!==old && S.dates.includes(neu)){alert('이미 있는 날짜입니다');return;}
  $('edit-date-wrap').style.display='none';
  mutateAndSave(()=>{
    if(neu!==old){
      S.dates=S.dates.map(d=>d===old?neu:d).sort();
      if(S.attendance[old]){S.attendance[neu]=S.attendance[old];delete S.attendance[old];}
      if(S.labels&&S.labels[old]){S.labels[neu]=S.labels[old];delete S.labels[old];}
      if(S.selDate===old)S.selDate=neu;
    }
    if(!S.labels)S.labels={};
    if(lbl) S.labels[neu]=lbl; else delete S.labels[neu];
  });
};

load();
</script>
</body>
</html>
