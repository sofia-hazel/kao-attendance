<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KAO 관피타 파트 연습참여</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f5f5;min-height:100vh;color:#1a1a1a}
.app{max-width:960px;margin:0 auto;padding:1.5rem 1rem}
h1{font-size:30px;font-weight:500;margin-bottom:1.25rem}
.main-layout{display:grid;grid-template-columns:1fr 1fr;gap:1.25rem}
@media(max-width:600px){.main-layout{grid-template-columns:1fr}}
.card{background:#fff;border:0.5px solid #e0e0e0;border-radius:12px;padding:1rem 0.5rem}
.sec-title{font-size:18px;font-weight:500;color:#888;text-transform:uppercase;letter-spacing:.05em;margin-bottom:10px}
.legend{display:flex;gap:12px;margin-bottom:10px;font-size:14px;color:#888;flex-wrap:wrap}
.legend-item{display:flex;align-items:center;gap:4px}
.legend-dot{width:9px;height:9px;border-radius:50%}
.dot-red{background:#E24B4A}
.dot-yellow{background:#378ADD}
.cal-header{display:grid;grid-template-columns:auto 1fr auto;align-items:center;margin-bottom:8px}
.cal-month{text-align:center}
.cal-nav{background:none;border:none;color:#888;font-size:29px;cursor:pointer;padding:2px 6px;border-radius:4px}
.cal-nav:hover{background:#f0f0f0}
.cal-month{font-size:22px;font-weight:500}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal-dow{font-size:16px;color:#aaa;text-align:center;padding:3px 0}
.cal-cell{text-align:center;padding:2px 1px;border-radius:4px;min-height:48px;display:flex;flex-direction:column;align-items:center;cursor:pointer}
.cal-cell:not(.other):hover .cal-num{background:#f0f0f0}
.cal-cell.other{opacity:.3;pointer-events:none}
.cal-num{font-size:18px;width:20px;height:20px;line-height:20px;border-radius:50%;color:#666}
.cal-cell.wed .cal-num{color:#1D9E75;font-weight:500}
.cal-cell.today .cal-num{background:#dbeafe;color:#1d4ed8}
.cal-cell.holiday .cal-num{color:#E24B4A}
.dots{display:flex;gap:2px;justify-content:center;margin-top:1px}
.dot-r{width:9px;height:9px;border-radius:50%;background:#E24B4A}
.dot-y{width:9px;height:9px;border-radius:50%;background:#378ADD}
.cal-ev-title{font-size:13px;color:#185FA5;max-width:52px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:1px}
.ev-box{margin-top:10px;background:#f8f8f8;border:0.5px solid #e0e0e0;border-radius:8px;padding:10px 12px;display:none}
.ev-box.show{display:block}
.ev-box-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.ev-box-date{font-size:18px;color:#aaa}
.ev-btns{display:flex;gap:4px}
.ev-edit{font-size:18px;background:none;border:0.5px solid #ddd;border-radius:4px;padding:2px 7px;cursor:pointer;color:#666}
.ev-edit:hover{color:#111}
.ev-del{font-size:19px;background:none;border:none;cursor:pointer;color:#aaa;padding:2px 4px}
.ev-del:hover{color:#E24B4A}
.ev-title{font-size:21px;font-weight:500;margin-bottom:3px}
.ev-content{font-size:19px;color:#666;line-height:1.6;white-space:pre-wrap}
.ev-add-row{display:flex;align-items:center;justify-content:space-between}
.ev-add-label{font-size:19px;color:#aaa}
.ev-add-btn{font-size:18px;background:#1D9E75;color:#fff;border:none;border-radius:6px;padding:3px 10px;cursor:pointer}
/* modal */
.modal-wrap{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;z-index:200}
.modal{background:#fff;border-radius:12px;padding:1.5rem;width:550px;max-width:90%;max-height:80vh;overflow-y:auto;box-shadow:0 8px 32px rgba(0,0,0,.15)}
.modal-hd{font-size:22px;font-weight:500;margin-bottom:12px}
.modal label{font-size:18px;color:#888;display:block;margin-bottom:4px;margin-top:10px}
.modal input,.modal textarea{width:100%;font-size:21px;padding:7px 10px;border:0.5px solid #ddd;border-radius:8px;background:#f8f8f8;font-family:inherit;resize:vertical;outline:none}
.modal textarea{min-height:250px}
.modal input:focus,.modal textarea:focus{border-color:#1D9E75}
.modal-btns{display:flex;gap:8px;margin-top:14px;justify-content:flex-end}
.btn-cancel{background:none;border:0.5px solid #ddd;border-radius:8px;padding:6px 14px;font-size:21px;color:#666;cursor:pointer}
.btn-save{background:#1D9E75;color:#fff;border:none;border-radius:8px;padding:6px 14px;font-size:21px;font-weight:500;cursor:pointer}
.btn-save:hover{background:#0F6E56}
/* tiles */
.tile-list{display:flex;flex-direction:column;gap:6px;margin-bottom:10px;max-height:460px;overflow-y:auto}
.date-tile{background:#f8f8f8;border:0.5px solid #e0e0e0;border-radius:8px;padding:8px 11px;cursor:pointer;transition:border-color .12s}
.date-tile:hover{border-color:#bbb}
.date-tile.sel{border-color:#1D9E75;border-width:1.5px}
.tile-top{display:flex;align-items:center;justify-content:space-between}
.tile-dt{font-size:21px;font-weight:500}
.del-t{background:none;border:none;font-size:16px;color:#aaa;cursor:pointer;padding:2px 4px}
.del-t:hover{color:#E24B4A}
.tile-stats{display:flex;gap:8px;margin-top:3px;font-size:18px}
.so{color:#1D9E75}.sx{color:#E24B4A}.sq{color:#aaa}
.add-row{display:flex;gap:6px}
.add-row input{flex:1;font-size:19px;padding:6px 8px;border:0.5px solid #ddd;border-radius:8px;background:#fff;outline:none}
.add-row input:focus{border-color:#1D9E75}
.btn-p{background:#1D9E75;color:#fff;border:none;border-radius:8px;padding:6px 12px;font-size:19px;font-weight:500;cursor:pointer;white-space:nowrap}
.btn-p:hover{background:#0F6E56}
/* attendance */
.detail-wrap{grid-column:1/-1}
.att-card{background:#fff;border:0.5px solid #e0e0e0;border-radius:12px;padding:1rem 1.25rem}
.att-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.att-title{font-size:26px;font-weight:500}
.close-btn{background:none;border:none;font-size:26px;color:#888;cursor:pointer}
.stats-row{display:flex;gap:8px;margin-bottom:14px}
.sp{flex:1;text-align:center;padding:5px 0;border-radius:8px;font-size:19px;font-weight:500}
.sp-o{background:#E1F5EE;color:#0F6E56}
.sp-x{background:#FCEBEB;color:#A32D2D}
.sp-q{background:#f5f5f5;color:#888}
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:12px}
@media(max-width:480px){.mgrid{grid-template-columns:repeat(2,1fr)}}
.mc{background:#f8f8f8;border:0.5px solid #e0e0e0;border-radius:8px;padding:8px 10px;display:flex;align-items:center;justify-content:space-between;gap:6px}
.mn{font-size:21px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bg{display:flex;gap:4px;flex-shrink:0}
.ab{width:28px;height:28px;border-radius:50%;border:0.5px solid #ddd;background:none;font-size:19px;font-weight:700;color:#aaa;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .1s}
.ab.ao{background:#1D9E75;color:#fff;border-color:#1D9E75}
.ab.ax{background:#E24B4A;color:#fff;border-color:#E24B4A}
.ab:hover{background:#eee}
.mgmt{border-top:0.5px solid #e0e0e0;padding-top:10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.mgmt-lbl{font-size:18px;color:#aaa;white-space:nowrap}
.mgmt-inp{flex:1;min-width:100px;font-size:19px;padding:5px 8px;border:0.5px solid #ddd;border-radius:6px;background:#f8f8f8;outline:none}
.btn-add-s{background:#1D9E75;color:#fff;border:none;border-radius:6px;padding:5px 10px;font-size:19px;cursor:pointer}
.btn-del-s{background:none;border:0.5px solid #ddd;border-radius:6px;padding:5px 10px;font-size:19px;color:#666;cursor:pointer}
.btn-del-s:hover{border-color:#E24B4A;color:#E24B4A}
.empty{font-size:21px;color:#aaa;text-align:center;padding:1rem 0}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#333;color:#fff;font-size:21px;padding:8px 18px;border-radius:20px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:300}
.toast.show{opacity:1}
.loading{font-size:19px;color:#aaa;text-align:center;padding:.5rem 0}
.footer{text-align:center;font-size:13px;color:#bbb;padding:1.5rem 0 1rem;line-height:1.8}
</style>
</head>
<body>

<div class="app">
  <h1 onclick="location.reload()" style="cursor:pointer" title="클릭하면 새로고침">KAO 관피타 파트 연습참여</h1>
  <div class="main-layout">
    <div class="card" id="cal-card">
      <div class="cal-header">
        <button class="cal-nav" id="prev-m">&#8249;</button>
        <span class="cal-month" id="cal-label"></span>
        <div style="display:flex;align-items:center;gap:7px;font-size:13px;color:#aaa">
          <span style="display:flex;align-items:center;gap:3px"><span style="width:8px;height:8px;border-radius:50%;background:#E24B4A;display:inline-block"></span>연습</span>
          <span style="display:flex;align-items:center;gap:3px"><span style="width:8px;height:8px;border-radius:50%;background:#378ADD;display:inline-block"></span>행사</span>
        </div>
      </div>
      <div class="cal-grid" id="cal-grid"></div>
      <div class="ev-box" id="ev-has">
        <div class="ev-box-top">
          <span class="ev-box-date" id="ev-has-date"></span>
          <div class="ev-btns">
            <button class="ev-edit" id="ev-edit-btn">수정</button>
            <button class="ev-del" id="ev-del-btn">✕</button>
          </div>
        </div>
        <div class="ev-title" id="ev-has-title"></div>
        <div class="ev-content" id="ev-has-content"></div>
      </div>
      <div class="ev-box" id="ev-none">
        <div class="ev-add-row">
          <span class="ev-add-label" id="ev-none-date"></span>
          <button class="ev-add-btn" id="ev-none-add">+ 일정 추가</button>
        </div>
      </div>
    </div>

    <div class="card">
      <div style="display:flex;gap:6px;margin-bottom:8px">
        <button id="past-toggle-btn" onclick="togglePast()" style="font-size:15px;background:none;border:0.5px solid #ddd;border-radius:6px;padding:3px 10px;color:#aaa;cursor:pointer">지난 날짜 보기</button>
        <button class="btn-p" id="add-date-btn" style="font-size:15px;padding:3px 12px">+ 추가</button>
      </div>
      <div class="tile-list" id="tile-list"><div class="loading">불러오는 중...</div></div>
    </div>

    <div class="detail-wrap" id="detail-wrap" style="display:none">
      <div class="att-card">
        <div class="att-hd">
          <span class="att-title" id="att-title"></span>
          <button class="close-btn" id="close-att">✕</button>
        </div>
        <div class="stats-row">
          <div class="sp sp-o" id="sp-o">참여 0명</div>
          <div class="sp sp-x" id="sp-x">불참 0명</div>
          <div class="sp sp-q" id="sp-q">미투표 0명</div>
        </div>
        <div class="mgrid" id="mgrid"></div>
        <div class="mgmt">
          <span class="mgmt-lbl">멤버 관리</span>
          <input class="mgmt-inp" type="text" id="add-m-in" placeholder="이름 입력">
          <button class="btn-add-s" id="add-m-btn">추가</button>
          <button class="btn-del-s" id="del-mode-btn">삭제 모드</button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- 날짜 수정 모달 -->
<div class="modal-wrap" id="edit-date-wrap" style="display:none">
  <div class="modal">
    <div class="modal-hd">날짜 수정</div>
    <label>날짜</label><input type="date" id="ed-date">
    <label>표시 텍스트 (선택)</label><input type="text" id="ed-label" placeholder="예: 특별 연습, 공연 준비 등">
    <div class="modal-btns">
      <button class="btn-cancel" id="ed-cancel">취소</button>
      <button class="btn-save" id="ed-save">저장</button>
    </div>
  </div>
</div>

<!-- modal -->
<div class="modal-wrap" id="modal-wrap" style="display:none">
  <div class="modal">
    <div class="modal-hd" id="modal-hd">일정 추가</div>
    <label>날짜</label><input type="date" id="m-date">
    <label>제목</label><input type="text" id="m-title" placeholder="일정 제목">
    <label>내용</label><textarea id="m-content" placeholder="상세 내용을 입력하세요"></textarea>
    <div class="modal-btns">
      <button class="btn-cancel" id="m-cancel">취소</button>
      <button class="btn-save" id="m-save">저장</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<div class="footer">

</div>

const GAS_URL = 'https://script.google.com/macros/s/AKfycbzLcn8psnogzO-LAWkh-Qq4Ml0Tl7D96-IcPJRaI1z1N0eohkbNx9ZrNE01Mqeuetw/exec';

const HOL = new Set(['2026-01-01','2026-02-16','2026-02-17','2026-02-18','2026-03-01','2026-05-05','2026-05-15','2026-06-06','2026-08-15','2026-09-24','2026-09-25','2026-09-26','2026-10-03','2026-10-09','2026-12-25']);
let S = {members:['김차현','김효경','소형준','오유선','이광빈','이연희','장아름','최송희'],dates:[],attendance:{},events:[],labels:{},selDate:null,selCal:null};
let calY = new Date().getFullYear(), calM = new Date().getMonth(), delMode = false, editIdx = null, showPast = false;

const $ = id => document.getElementById(id);

function toStr(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function fmt(s){ const p=s.split('-'),d=new Date(+p[0],+p[1]-1,+p[2]),n=['일','월','화','수','목','금','토']; return `${d.getMonth()+1}월 ${d.getDate()}일 (${n[d.getDay()]})`; }
function fmtFull(s){ const base=fmt(s); const lbl=(S.labels&&S.labels[s])?` · ${S.labels[s]}`:''; return base+lbl; }
function toast(msg){ const t=$('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2000); }

async function gasGet(key){
  try{
    const r = await fetch(`${GAS_URL}?action=get&key=${encodeURIComponent(key)}`);
    const j = await r.json();
    if(j.ok && j.value){
      localStorage.setItem('kao_bak_'+key, j.value);
      return j.value;
    }
    return null;
  }catch(e){
    // GAS GET 실패 시 localStorage 백업에서 복구
    const bak = localStorage.getItem('kao_bak_'+key);
    return bak || null;
  }
}
async function gasSet(key, value){
  // 저장 시 항상 localStorage에도 백업
  try{ localStorage.setItem('kao_bak_'+key, value); }catch(e){}
  try{
    await fetch(GAS_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({app: 'kao', action: 'set', key, value})
    });
  }catch(e){}
}

async function load(){
  if(!localStorage.getItem(RESTORE_KEY)){
    const json=JSON.stringify(RESTORE_DATA);
    localStorage.setItem('kao_bak_kao-state', json);
    localStorage.setItem(RESTORE_KEY, '1');
    gasSet('kao-state', json);
  }
  try{
    const v = await gasGet('kao-state');
    if(v){ const d=JSON.parse(v); S.members=d.members||S.members; S.attendance=d.attendance||{}; S.events=d.events||[]; S.dates=d.dates||[]; S.deleted=d.deleted||[]; S.labels=d.labels||{}; }
  }catch(e){}
  autoWed(); render();
  $('ver-badge').textContent = APP_VERSION;
}
async function sv(){ await gasSet('kao-state', JSON.stringify({members:S.members,attendance:S.attendance,events:S.events,dates:S.dates,deleted:S.deleted,labels:S.labels})); toast('저장됨'); }

function autoWed(){
  const today=new Date(); today.setHours(0,0,0,0);
  const start=new Date(today);
  const diff=((3-today.getDay()+7)%7)||7;
  start.setDate(start.getDate()+diff);
  const ex=new Set(S.dates);
  const del=new Set(S.deleted||[]);
  for(let i=0;i<8;i++){ const d=new Date(start); d.setDate(d.getDate()+i*7); const s=toStr(d); if(!HOL.has(s)&&!ex.has(s)&&!del.has(s)){S.dates.push(s);ex.add(s);} }
  S.dates=[...new Set(S.dates)].sort();
}
function stats(dt){ const a=S.attendance[dt]||{}; let o=0,x=0; S.members.forEach(m=>{if(a[m]==='o')o++;else if(a[m]==='x')x++;}); return{o,x,q:S.members.length-o-x}; }
function render(){ rCal(); rTiles(); rDetail(); }

function rCal(){
  $('cal-label').textContent=`${calY}년 ${calM+1}월`;
  const dn=['일','월','화','수','목','금','토'];
  let h=dn.map(d=>`<div class="cal-dow">${d}</div>`).join('');
  const first=new Date(calY,calM,1),last=new Date(calY,calM+1,0),tod=toStr(new Date());
  const em={}; S.events.forEach((ev,i)=>{em[ev.date]={...ev,i};});
  for(let i=0;i<first.getDay();i++){ const d=new Date(calY,calM,1-first.getDay()+i); h+=`<div class="cal-cell other"><div class="cal-num">${d.getDate()}</div></div>`; }
  for(let d=1;d<=last.getDate();d++){
    const dt=new Date(calY,calM,d),s=toStr(dt);
    const wed=dt.getDay()===3,hol=HOL.has(s),isT=s===tod,hasEv=!!em[s];
    let cls='cal-cell'; if(wed)cls+=' wed'; if(hol)cls+=' holiday'; if(isT)cls+=' today';
    let dots=''; if(wed&&!hol)dots+=`<div class="dot-r"></div>`; if(hasEv)dots+=`<div class="dot-y"></div>`;
    const et=hasEv?`<div class="cal-ev-title">${em[s].title}</div>`:'';
    h+=`<div class="${cls}" onclick="cClick('${s}')"><div class="cal-num">${d}</div>${dots?`<div class="dots">${dots}</div>`:''}${et}</div>`;
  }
  const rem=(7-(first.getDay()+last.getDate())%7)%7;
  for(let i=1;i<=rem;i++)h+=`<div class="cal-cell other"><div class="cal-num">${i}</div></div>`;
  $('cal-grid').innerHTML=h; rEvBox();
}

function cClick(s){ S.selCal=s; rEvBox(); }
function rEvBox(){
  const em={}; S.events.forEach((ev,i)=>{em[ev.date]={...ev,i};});
  const hb=$('ev-has'),nb=$('ev-none');
  if(!S.selCal){ hb.classList.remove('show'); nb.classList.remove('show'); return; }
  if(em[S.selCal]){
    const ev=em[S.selCal];
    $('ev-has-date').textContent=fmt(S.selCal);
    $('ev-has-title').textContent=ev.title;
    $('ev-has-content').textContent=ev.content||'';
    hb.classList.add('show'); nb.classList.remove('show');
    $('ev-edit-btn').onclick=()=>openModal(S.selCal,ev.i);
    $('ev-del-btn').onclick=()=>{ S.events.splice(ev.i,1); S.selCal=null; sv(); render(); };
  } else {
    $('ev-none-date').textContent=fmt(S.selCal);
    nb.classList.add('show'); hb.classList.remove('show');
    $('ev-none-add').onclick=()=>openModal(S.selCal,null);
  }
}

function openModal(date,idx){
  editIdx=idx;
  $('modal-hd').textContent=idx!=null?'일정 수정':'일정 추가';
  $('m-date').value=date||'';
  $('m-title').value=idx!=null?S.events[idx].title:'';
  $('m-content').value=idx!=null?(S.events[idx].content||''):'';
  $('modal-wrap').style.display='flex';
}
$('m-cancel').onclick=()=>$('modal-wrap').style.display='none';
$('m-content').addEventListener('keydown',e=>{if(e.key==='Enter'&&(e.ctrlKey||e.metaKey))$('m-save').click();});
$('modal-wrap').onclick=e=>{ if(e.target===$('modal-wrap'))$('modal-wrap').style.display='none'; };
$('m-save').onclick=()=>{
  const date=$('m-date').value,title=$('m-title').value.trim(),content=$('m-content').value.trim();
  if(!date||!title)return;
  if(editIdx!=null){S.events[editIdx]={date,title,content};}else{S.events.push({date,title,content});}
  S.selCal=date; $('modal-wrap').style.display='none'; sv(); render();
};

function togglePast(){
  showPast=!showPast;
  const btn=$('past-toggle-btn');
  btn.textContent=showPast?'지난 날짜 숨기기':'지난 날짜 보기';
  btn.style.color=showPast?'#1D9E75':'#aaa';
  btn.style.borderColor=showPast?'#1D9E75':'#ddd';
  rTiles();
}

function rTiles(){
  const l=$('tile-list');
  const tod=toStr(new Date());
  const visible=showPast?S.dates:S.dates.filter(d=>d>=tod);
  if(!visible.length){l.innerHTML=`<div class="empty">${S.dates.length?'지난 날짜만 있어요 · 위 버튼으로 보기':'날짜를 추가해 주세요'}</div>`;return;}
  l.innerHTML=visible.map(d=>{
    const st=stats(d),sel=S.selDate===d?' sel':'';
    return `<div class="date-tile${sel}" onclick="openAtt('${d}')"><div class="tile-top"><span class="tile-dt">${fmtFull(d)}</span><div style="display:flex;gap:4px"><button class="del-t" style="font-size:11px;border:0.5px solid #ddd;border-radius:4px;padding:2px 7px;color:#666" onclick="event.stopPropagation();editDate('${d}')">수정</button><button class="del-t" onclick="event.stopPropagation();delD('${d}')">✕</button></div></div><div class="tile-stats"><span class="so">참여 ${st.o}명</span><span class="sx">불참 ${st.x}명</span><span class="sq">미투표 ${st.q}명</span></div></div>`;
  }).join('');
}

function rDetail(){
  const w=$('detail-wrap');
  if(!S.selDate){w.style.display='none';return;}
  w.style.display='block';
  $('att-title').textContent=fmt(S.selDate);
  const st=stats(S.selDate);
  $('sp-o').textContent=`참여 ${st.o}명`; $('sp-x').textContent=`불참 ${st.x}명`; $('sp-q').textContent=`미투표 ${st.q}명`;
  const att=S.attendance[S.selDate]||{};
  if(!S.members.length){$('mgrid').innerHTML='<div class="empty">멤버가 없습니다</div>';return;}
  $('mgrid').innerHTML=S.members.map(m=>{
    const v=att[m]||'';
    const db=delMode?`<button class="del-t" style="margin-left:4px" onclick="delM('${m}')">✕</button>`:'';
    return `<div class="mc"><span class="mn">${m}</span><div class="bg"><button class="ab${v==='o'?' ao':''}" onclick="setA('${m}','o')">O</button><button class="ab${v==='x'?' ax':''}" onclick="setA('${m}','x')">X</button></div>${db}</div>`;
  }).join('');
  const db=$('del-mode-btn');
  db.textContent=delMode?'완료':'삭제 모드'; db.style.borderColor=delMode?'#E24B4A':''; db.style.color=delMode?'#E24B4A':'';
}

function openAtt(d){ S.selDate=d; delMode=false; render(); $('detail-wrap').scrollIntoView({behavior:'smooth',block:'nearest'}); }
function setA(m,v){ if(!S.attendance[S.selDate])S.attendance[S.selDate]={}; const c=S.attendance[S.selDate][m]; S.attendance[S.selDate][m]=c===v?'':v; sv(); rTiles(); rDetail(); }
function delD(s){ if(!confirm(`${fmt(s)} 삭제할까요?`))return; S.dates=S.dates.filter(d=>d!==s); if(!S.deleted)S.deleted=[]; if(!S.deleted.includes(s))S.deleted.push(s); if(S.selDate===s)S.selDate=null; sv(); render(); }
function delM(m){ S.members=S.members.filter(x=>x!==m); sv(); rDetail(); }

$('close-att').onclick=()=>{ S.selDate=null; delMode=false; render(); };
$('prev-m').onclick=()=>{ calM--; if(calM<0){calM=11;calY--;} rCal(); };
$('next-m').onclick=()=>{ calM++; if(calM>11){calM=0;calY++;} rCal(); };
const _hiddenDateIn = document.createElement('input');
_hiddenDateIn.type='date'; _hiddenDateIn.style.cssText='position:absolute;opacity:0;pointer-events:none;width:0;height:0';
document.body.appendChild(_hiddenDateIn);
_hiddenDateIn.addEventListener('change',()=>{
  const v=_hiddenDateIn.value; _hiddenDateIn.value=''; if(!v)return;
  if(S.dates.includes(v)){alert('이미 있는 날짜입니다');return;}
  S.dates.push(v); S.dates=[...new Set(S.dates)].sort(); sv(); render();
});
$('add-date-btn').onclick=()=>{ _hiddenDateIn.showPicker&&_hiddenDateIn.showPicker()||_hiddenDateIn.click(); };
$('add-m-btn').onclick=()=>{
  const v=$('add-m-in').value.trim(); if(!v)return;
  if(S.members.includes(v)){alert('이미 있는 멤버입니다');return;}
  S.members.push(v); $('add-m-in').value=''; sv(); rDetail();
};
$('add-m-in').addEventListener('keydown',e=>{ if(e.key==='Enter')$('add-m-btn').click(); });
$('del-mode-btn').onclick=()=>{ delMode=!delMode; rDetail(); };

let editDateTarget=null;
function editDate(old){
  editDateTarget=old;
  $('ed-date').value=old;
  $('ed-label').value=(S.labels&&S.labels[old])||'';
  $('edit-date-wrap').style.display='flex';
}
$('ed-cancel').onclick=()=>{ $('edit-date-wrap').style.display='none'; };
$('edit-date-wrap').onclick=e=>{ if(e.target===$('edit-date-wrap'))$('edit-date-wrap').style.display='none'; };
$('ed-save').onclick=()=>{
  const old=editDateTarget;
  const neu=$('ed-date').value;
  const lbl=$('ed-label').value.trim();
  if(!neu)return;
  if(neu!==old){
    if(S.dates.includes(neu)){alert('이미 있는 날짜입니다');return;}
    S.dates=S.dates.map(d=>d===old?neu:d).sort();
    if(S.attendance[old]){S.attendance[neu]=S.attendance[old];delete S.attendance[old];}
    if(S.labels&&S.labels[old]){S.labels[neu]=S.labels[old];delete S.labels[old];}
    if(S.selDate===old)S.selDate=neu;
  }
  if(!S.labels)S.labels={};
  if(lbl) S.labels[neu]=lbl; else delete S.labels[neu];
  $('edit-date-wrap').style.display='none';
  sv(); render();
};

load();
</script>
</body>
</html>
